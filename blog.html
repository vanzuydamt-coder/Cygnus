<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquarium Tech Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      font-family: var(--font-body);
    }

    .blog-page {
      text-align: center;
      padding: 48px 24px;
    }

    .blog-page h1 {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 5vw, 4.5rem);
      letter-spacing: 0.06em;
      margin: 0 0 16px;
    }

    .blog-page p {
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .blog-page a {
      display: inline-block;
      margin-top: 28px;
      color: var(--bg);
      background: var(--text);
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="blog-page">
    <h1>Aquarium Tech Blog</h1>
    <p>Coming soon</p>
    <a href="index.html">Back to Home</a>
  </main>
</body>
</html>
